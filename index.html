<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ma Phonothèque</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phonothèque">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --accent: #2563eb;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --badge-vinyle-bg: #451a03; --badge-vinyle-text: #fde68a;
      --badge-cd-bg: #1e3a8a;     --badge-cd-text: #bfdbfe;
      --badge-sacd-bg: #581c87;   --badge-sacd-text: #e9d5ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(40px + env(safe-area-inset-bottom)); max-width: 900px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.6rem; font-weight: 700; }
    .stats { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; }

    .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.95rem; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: #27272a; color: var(--text); border: 1px solid #3f3f46; }

    .toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .search-bar { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 1rem; }

    .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); cursor: pointer; font-size: 0.9rem; font-weight: 500; }
    .filter-btn.active { background: var(--text); color: var(--bg); font-weight: 700; }

    .artist-section { margin-bottom: 32px; }
    .artist-header { font-size: 1.25rem; font-weight: 700; padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; color: #38bdf8; }
    .artist-count { font-size: 0.85rem; color: var(--text-muted); font-weight: 400; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .card { position: relative; background: var(--card-bg); border-radius: 14px; padding: 12px; border: 1px solid var(--card-border); display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background 0.2s; }
    .card:active { background: #27272a; }
    .card img { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; background: #27272a; flex-shrink: 0; }
    .card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; gap: 4px; }
    .card .title { font-weight: 700; font-size: 1.05rem; line-height: 1.25; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .conductor { font-size: 0.85rem; color: var(--text-muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .badge { display: inline-block; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; width: fit-content; }
    .badge-vinyle { background: var(--badge-vinyle-bg); color: var(--badge-vinyle-text); }
    .badge-cd { background: var(--badge-cd-bg); color: var(--badge-cd-text); }
    .badge-sacd { background: var(--badge-sacd-bg); color: var(--badge-sacd-text); }

    .file-input-label { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

    /* Modal Fiche Détaillée */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal-content { background: #18181b; border: 1px solid #27272a; border-radius: 20px; width: 100%; max-width: 440px; padding: 24px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .detail-cover { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; margin-bottom: 16px; background: #27272a; }
    .detail-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; line-height: 1.2; }
    .detail-artist { font-size: 1.1rem; color: #38bdf8; font-weight: 600; margin-bottom: 8px; }
    .detail-conductor { font-size: 0.95rem; color: var(--text-muted); font-style: italic; margin-bottom: 16px; }
    .detail-meta { background: #09090b; border: 1px solid #27272a; border-radius: 12px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; }
    .detail-meta-item { display: flex; justify-content: space-between; align-items: center; }
    .detail-meta-label { color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Phonothèque</h1>
      <div class="stats" id="statsCount">0 album</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-secondary" onclick="pickRandom()">🎲</button>
      <label class="btn file-input-label">
        📁 Importer CSV
        <input type="file" accept=".csv" onchange="importCSVFile(event)" style="display: none;">
      </label>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-bar" placeholder="Rechercher artiste, titre, chef..." oninput="render()">
    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" onclick="filterSupport('TOUS', this)">Tous</button>
        <button class="filter-btn" onclick="filterSupport('Vinyle', this)">Vinyles</button>
        <button class="filter-btn" onclick="filterSupport('CD', this)">CD</button>
        <button class="filter-btn" onclick="filterSupport('SACD', this)">SACD</button>
      </div>
      <button class="btn btn-secondary" style="font-size:0.8rem; padding:8px 12px;" onclick="resetCollection()">🗑️ Vider</button>
    </div>
  </div>

  <div id="mainContainer"></div>

  <!-- Modal Fiche Détaillée -->
  <div id="detailModal" class="modal" onclick="closeDetailModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 style="font-size: 1.1rem;">Détails de l'album</h3>
        <button class="btn btn-secondary" style="padding: 4px 12px; font-size: 1rem;" onclick="closeDetailModal()">&times;</button>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>

  <script>
    let collection = JSON.parse(localStorage.getItem('phonotheque_data')) || [];
    let activeFilter = 'TOUS';

    function saveCollection() {
      localStorage.setItem('phonotheque_data', JSON.stringify(collection));
      render();
    }

    function resetCollection() {
      if (confirm("Effacer tous les albums de l'application ?")) {
        collection = [];
        saveCollection();
      }
    }

    function render() {
      const container = document.getElementById('mainContainer');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      let filtered = collection.filter(album => {
        const matchesFilter = activeFilter === 'TOUS' || (album.support && album.support.toLowerCase() === activeFilter.toLowerCase());
        const matchesSearch = (album.artist && album.artist.toLowerCase().includes(searchQuery)) || 
                              (album.title && album.title.toLowerCase().includes(searchQuery)) ||
                              (album.conductor && album.conductor.toLowerCase().includes(searchQuery));
        return matchesFilter && matchesSearch;
      });

      document.getElementById('statsCount').innerText = `${filtered.length} album${filtered.length > 1 ? 's' : ''}` + (activeFilter !== 'TOUS' ? ` (${activeFilter})` : '');

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); padding: 40px 0; text-align: center; font-size: 1rem;">Aucun album trouvé.<br><br>Si la liste est vide, clique sur <strong>📁 Importer CSV</strong>.</p>';
        return;
      }

      const grouped = {};
      filtered.forEach(album => {
        if (!grouped[album.artist]) grouped[album.artist] = [];
        grouped[album.artist].push(album);
      });

      Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' })).forEach(artistName => {
        const artistAlbums = grouped[artistName];
        artistAlbums.sort((a, b) => a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' }));

        const section = document.createElement('div');
        section.className = 'artist-section';
        section.innerHTML = `<div class="artist-header"><span>${artistName}</span><span class="artist-count">(${artistAlbums.length})</span></div><div class="grid"></div>`;
        
        const grid = section.querySelector('.grid');
        artistAlbums.forEach((album) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openDetailModal(album);

          const coverSrc = album.cover || 'https://via.placeholder.com/150/27272a/a1a1aa?text=Pas+d%27image';
          const supportName = album.support || 'CD';
          const badgeClass = 'badge-' + supportName.toLowerCase();

          card.innerHTML = `
            <img src="${coverSrc}" alt="Pochette" onerror="this.src='https://via.placeholder.com/150/27272a/a1a1aa?text=Erreur+Image'">
            <div class="card-info">
              <div>
                <span class="badge ${badgeClass}">${supportName}</span>
                <div class="title" title="${album.title}">${album.title}</div>
                ${album.conductor ? `<div class="conductor" title="${album.conductor}">Dir. : ${album.conductor}</div>` : ''}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
        container.appendChild(section);
      });
    }

    function openDetailModal(album) {
      const coverSrc = album.cover || 'https://via.placeholder.com/300/27272a/a1a1aa?text=Pas+d%27image';
      const supportName = album.support || 'CD';
      const badgeClass = 'badge-' + supportName.toLowerCase();

      const detailBody = document.getElementById('detailBody');
      detailBody.innerHTML = `
        <img src="${coverSrc}" class="detail-cover" alt="Pochette" onerror="this.src='https://via.placeholder.com/300/27272a/a1a1aa?text=Erreur+Image'">
        <div class="detail-title">${album.title}</div>
        <div class="detail-artist">${album.artist}</div>
        ${album.conductor ? `<div class="detail-conductor">Dir. : ${album.conductor}</div>` : ''}
        
        <div class="detail-meta">
          <div class="detail-meta-item">
            <span class="detail-meta-label">Support :</span>
            <span class="badge ${badgeClass}">${supportName}</span>
          </div>
        </div>
      `;

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetailModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    function filterSupport(support, btn) {
      activeFilter = support;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function pickRandom() {
      if (!collection.length) return alert("Collection vide !");
      const a = collection[Math.floor(Math.random() * collection.length)];
      alert(`Au hasard :\n\n${a.artist} - ${a.title} (${a.support})`);
    }

    function importCSVFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split(/\r?\n/);
        if (lines.length < 2) return;

        function parseCSVLine(line) {
          const result = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
            else if (c === '"') { inQuotes = !inQuotes; }
            else if (c === ',' && !inQuotes) { result.push(cur); cur = ''; }
            else { cur += c; }
          }
          result.push(cur);
          return result;
        }

        const headers = parseCSVLine(lines[0]).map(h => h.trim());
        const titleIdx = headers.indexOf('Title');
        const artistIdx = headers.indexOf('Artist');
        const mediaIdx = headers.indexOf('Media');
        const conductorIdx = headers.indexOf('Conductors');
        const coverIdx = headers.indexOf('Uploaded Image URL');

        const imported = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const cols = parseCSVLine(lines[i]);
          if (cols.length <= titleIdx) continue;

          let support = cols[mediaIdx] || 'CD';
          if (support.includes('Vinyl') || support.includes('Vinyle')) support = 'Vinyle';
          else if (support.includes('SACD')) support = 'SACD';
          else support = 'CD';

          imported.push({
            title: cols[titleIdx] || 'Sans titre',
            artist: cols[artistIdx] || 'Artiste inconnu',
            conductor: cols[conductorIdx] || '',
            support: support,
            cover: cols[coverIdx] || ''
          });
        }

        if (imported.length > 0) {
          collection = imported;
          saveCollection();
          alert(`${collection.length} albums importés avec succès !`);
        } else {
          alert("Aucun album valide trouvé dans le fichier.");
        }
      };
      reader.readAsText(file);
    }

    render();
  </script>
</body>
</html>
