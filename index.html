<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ma Phonothèque</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phonothèque">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --accent: #2563eb;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --danger: #dc2626;
      --badge-vinyle-bg: #451a03; --badge-vinyle-text: #fde68a;
      --badge-cd-bg: #1e3a8a;     --badge-cd-text: #bfdbfe;
      --badge-sacd-bg: #581c87;   --badge-sacd-text: #e9d5ff;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg); 
      color: var(--text);
    }

    body { 
      padding: 16px; 
      padding-top: calc(16px + env(safe-area-inset-top)); 
      padding-bottom: calc(40px + env(safe-area-inset-bottom)); 
      max-width: 900px; 
      margin: 0 auto; 
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start; 
      margin-bottom: 16px; 
      padding-bottom: 12px; 
      border-bottom: 1px solid var(--border); 
    }
    
    h1 { font-size: 1.5rem; font-weight: 700; }
    .stats { 
      font-size: 0.78rem; 
      color: var(--text-muted); 
      margin-top: 2px; 
      line-height: 1.35;
    }

    .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .btn { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 8px 12px; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 0.85rem; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      text-decoration: none;
      gap: 4px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: #27272a; color: var(--text); border: 1px solid #3f3f46; }
    .btn-danger { background: var(--danger); color: white; }

    .toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    /* Zone de recherche avec croix d'effacement + Menu de tri */
    .search-container {
      display: flex !important;
      align-items: center !important;
      position: relative !important;
      gap: 8px !important;
      margin-bottom: 12px !important;
      width: 100% !important;
    }

    .search-input-wrapper {
      position: relative !important;
      flex: 1 1 auto !important;
      display: flex !important;
      align-items: center !important;
      min-width: 0 !important;
    }

    .search-input-wrapper input {
      width: 100% !important;
      padding: 8px 32px 8px 10px !important;
      font-size: 0.85rem !important;
      border-radius: 10px !important;
      border: 1px solid var(--border) !important;
      background: var(--card-bg) !important;
      color: var(--text) !important;
      box-sizing: border-box !important;
    }

    .clear-search-btn {
      position: absolute !important;
      right: 10px !important;
      background: none !important;
      border: none !important;
      color: #8e8e93 !important;
      font-size: 14px !important;
      cursor: pointer !important;
      display: none;
      padding: 0 !important;
    }

    /* Menu de tri compact */
    .sort-select {
      flex: 0 0 auto !important;
      width: 115px !important;
      padding: 8px 4px !important;
      font-size: 0.78rem !important;
      color: #ffffff !important;
      background-color: #1c1c1e !important;
      color-scheme: dark !important;
      border: 1px solid #3a3a3c !important;
      border-radius: 8px !important;
      outline: none;
    }

    /* Filtres et bouton vider */
    .controls {
      width: 100% !important;
      overflow: hidden !important;
      margin-bottom: 20px !important;
    }

    .controls .filters {
      display: flex !important;
      align-items: center !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      gap: 6px !important;
      width: 100% !important;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .controls .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn { 
      padding: 6px 14px; 
      border-radius: 20px; 
      border: 1px solid var(--border); 
      background: var(--card-bg); 
      color: var(--text-muted); 
      cursor: pointer; 
      font-size: 0.85rem; 
      font-weight: 500; 
      flex-shrink: 0 !important;
      white-space: nowrap !important;
    }
    .filter-btn.active { background: var(--text); color: var(--bg); font-weight: 700; }

    .artist-section { margin-bottom: 28px; scroll-margin-top: 40px; }
    .artist-header { 
      font-size: 1.15rem; 
      font-weight: 700; 
      padding-bottom: 6px; 
      margin-bottom: 12px; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      color: #38bdf8; 
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .artist-count { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; flex-shrink: 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    
    .card { 
      position: relative; 
      background: var(--card-bg); 
      border-radius: 12px; 
      padding: 10px; 
      border: 1px solid var(--card-border); 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      cursor: pointer; 
      overflow: hidden;
    }
    .card:active { background: #27272a; }
    
    .card img { width: 85px; height: 85px; object-fit: cover; border-radius: 8px; background: #27272a; flex-shrink: 0; }
    
    .card-info { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      min-width: 0; 
      height: 85px; 
    }
    
    .card .title { 
      font-weight: 700; 
      font-size: 0.92rem; 
      line-height: 1.2; 
      color: var(--text); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    
    .card .conductor { 
      font-size: 0.78rem; 
      color: var(--text-muted); 
      font-style: italic; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    .card .meta-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .badge { display: inline-block; font-size: 0.65rem; padding: 2px 6px; border-radius: 5px; font-weight: 700; text-transform: uppercase; width: fit-content; }
    .badge-vinyle { background: var(--badge-vinyle-bg); color: var(--badge-vinyle-text); }
    .badge-cd { background: var(--badge-cd-bg); color: var(--badge-cd-text); }
    .badge-sacd { background: var(--badge-sacd-bg); color: var(--badge-sacd-text); }

    .card-btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 4px;
    }
    .card-btn-icon:hover { color: var(--text); background: #27272a; }

    .file-input-label { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }

    /* Étiquette pays cliquable */
    .country-tag {
      cursor: pointer !important;
      text-decoration: underline !important;
      text-decoration-style: dotted !important;
    }
    .country-tag:hover {
      color: #0a84ff !important;
    }

    /* Modals */
    .modal { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.85); 
      backdrop-filter: blur(8px); 
      -webkit-backdrop-filter: blur(8px); 
      z-index: 1000; 
      justify-content: center; 
      align-items: center; 
      padding: 16px; 
    }
    
    .modal-content { 
      background: #18181b; 
      border: 1px solid #27272a; 
      border-radius: 16px; 
      width: 100%; 
      max-width: 440px; 
      padding: 20px; 
      max-height: 90vh; 
      overflow-y: auto; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      word-break: break-word;
    }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .detail-cover { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; margin-bottom: 14px; background: #27272a; }
    .detail-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; line-height: 1.2; word-break: break-word; }
    .detail-artist { font-size: 1.05rem; color: #38bdf8; font-weight: 600; margin-bottom: 6px; word-break: break-word; }
    .detail-conductor { font-size: 0.9rem; color: var(--text-muted); font-style: italic; margin-bottom: 14px; word-break: break-word; }
    
    .detail-meta { 
      background: #09090b; 
      border: 1px solid #27272a; 
      border-radius: 10px; 
      padding: 12px; 
      margin-bottom: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      font-size: 0.88rem; 
    }
    .detail-meta-item { display: flex; justify-content: space-between; align-items: center; }
    .detail-meta-label { color: var(--text-muted); }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* Form Styles - Alignement et hauteur stricte pour iOS Safari */
    .modal-content form {
      display: flex !important;
      flex-direction: column !important;
      gap: 12px !important;
    }

    .form-group {
      margin-bottom: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
    }

    .form-group label {
      display: block !important;
      font-size: 0.8rem !important;
      color: var(--text-muted) !important;
      margin-bottom: 4px !important;
      font-weight: 600 !important;
    }

    .form-group input, 
    .form-group select {
      width: 100% !important;
      height: 38px !important;
      max-height: 38px !important;
      padding: 6px 8px !important;
      border-radius: 8px !important;
      border: 1px solid #3f3f46 !important;
      background: #09090b !important;
      color: var(--text) !important;
      font-size: 0.85rem !important;
      box-sizing: border-box !important;
      -webkit-appearance: none !important;
    }

    /* Correctif spécifique iOS Safari pour forcer la date à tenir sur une ligne */
    input[type="date"] {
      font-size: 0.78rem !important;
    }

    input[type="date"]::-webkit-date-and-time-value {
      text-align: left !important;
      line-height: 24px !important;
      height: 24px !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .form-row {
      display: flex !important;
      gap: 10px !important;
      width: 100% !important;
      align-items: flex-end !important;
    }

    .form-row .form-group {
      flex: 1 1 0% !important;
      min-width: 0 !important;
    }

    /* Index alphabétique */
    #alphabet-index {
      position: fixed;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      margin-top: 22px !important;
      display: flex;
      flex-direction: column;
      gap: 1px;
      z-index: 1000;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 2px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-height: 85vh;
      overflow-y: auto;
    }

    .index-letter {
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 4px;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
      line-height: 1;
    }

    .index-letter:active {
      color: #ffffff;
      background: #2563eb;
    }
  </style>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
  <div id="alphabet-index"></div>
  
  <header style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px;">
    <div style="flex: 1 1 auto; min-width: 0;">
      <h1 style="margin: 0 0 4px 0;">Phonothèque</h1>
      <div class="stats" id="statsCount" style="font-size: 0.8rem; color: #8e8e93; line-height: 1.3;">Chargement...</div>
    </div>

    <div class="header-actions" style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; margin-left: auto;">
      <div style="display: flex; flex-direction: row; gap: 6px;">
        <button class="btn" onclick="openFormModal()" title="Ajouter un album" style="width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px;">+</button>
        <button class="btn btn-secondary" onclick="pickRandom()" title="Album aléatoire" style="width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 16px;">🎲</button>
      </div>

      <div style="display: flex; flex-direction: row; gap: 6px;">
        <button class="btn btn-secondary" onclick="exportToCSV()" title="Exporter en CSV" style="height: 34px; padding: 0 8px; display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap;">📥 Exporter</button>
        <label class="btn btn-secondary file-input-label" title="Importer un fichier CSV" style="height: 34px; padding: 0 8px; display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; margin: 0; cursor: pointer;">
          📤 Importer
          <input type="file" accept=".csv" onchange="importFromCSV(event)" style="display: none;">
        </label>
      </div>
    </div>
  </header>

  <!-- Zone Recherche + Tri -->
  <div class="search-container">
    <div class="search-input-wrapper">
      <input type="text" id="searchInput" placeholder="Rechercher titre, artiste, chef..." oninput="handleSearchInput()">
      <button type="button" id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()">✖</button>
    </div>
    <select id="sortSelect" class="sort-select" onchange="render()">
      <option value="artist">Artiste (A-Z)</option>
      <option value="yearDesc">Année (Récent → Ancien)</option>
      <option value="yearAsc">Année (Ancien → Récent)</option>
      <option value="dateAdded">Derniers ajoutés</option>
    </select>
  </div>

  <!-- Filtres par support -->
  <div class="controls">
    <div class="filters">
      <button class="filter-btn active" onclick="filterSupport('TOUS', this)">Tous</button>
      <button class="filter-btn" onclick="filterSupport('Vinyle', this)">Vinyles</button>
      <button class="filter-btn" onclick="filterSupport('CD', this)">CD</button>
      <button class="filter-btn" onclick="filterSupport('SACD', this)">SACD</button>
      <button class="filter-btn" onclick="filterSupport('WISHLIST', this)">💡 Envie</button>
      <button class="filter-btn" style="color: #f87171; border-color: #451a03;" onclick="resetCollection()">🗑️ Vider</button>
    </div>
  </div>

  <div id="mainContainer"></div>

  <!-- Modal Fiche Détaillée -->
  <div id="detailModal" class="modal" onclick="closeDetailModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 style="font-size: 1.1rem;">Détails de l'album</h3>
        <button class="btn btn-secondary" style="padding: 4px 10px;" onclick="closeDetailModal()">&times;</button>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- Modal Formulaire (Ajout / Édition) -->
  <div id="formModal" class="modal" onclick="closeFormModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="formModalTitle" style="font-size: 1.1rem;">Ajouter un album</h3>
        <button class="btn btn-secondary" style="padding: 4px 10px;" onclick="closeFormModal()">&times;</button>
      </div>
      <form id="albumForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editIndex" value="-1">
        
        <!-- Bloc Scanner -->
        <div class="form-group" style="margin-bottom: 16px;">
          <button type="button" class="btn" style="width: 100%; background: #059669;" onclick="toggleScanner()">📷 Scanner un code-barres</button>
          <div id="qr-reader" style="width: 100%; margin-top: 10px; display: none; border-radius: 8px; overflow: hidden; border: 1px solid var(--border);"></div>
        </div>
        
        <!-- Recherche auto Discogs -->
        <div class="form-group" style="margin-bottom: 16px;">
          <label>Recherche auto (Code-barres ou Réf. Catalogue)</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="manualQuery" placeholder="ex: 060253712345 ou SD 19129" style="flex: 1;">
            <button type="button" class="btn btn-secondary" onclick="searchDiscogsAuto()">🔍 Chercher</button>
          </div>
        </div>

        <div class="form-group">
          <label>Artiste / Compositeur *</label>
          <input type="text" id="formArtist" required placeholder="ex: Genesis">
        </div>
        <div class="form-group">
          <label>Titre de l'album *</label>
          <input type="text" id="formTitle" required placeholder="ex: Foxtrot">
        </div>
        <div class="form-group">
          <label>Chef d'orchestre / Interprète</label>
          <input type="text" id="formConductor" placeholder="ex: Herbert von Karajan">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Année de sortie</label>
            <input type="text" id="formYear" placeholder="ex: 1973">
          </div>
          <div class="form-group">
            <label>Pays d'édition</label>
            <input type="text" id="formCountry" placeholder="ex: Japon">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Date d'achat</label>
            <input type="date" id="formPurchaseDate">
          </div>
          <div class="form-group">
            <label>Prix d'achat (€)</label>
            <input type="number" id="formPurchasePrice" step="0.01" placeholder="ex: 25.00">
          </div>
        </div>
        <div class="form-group">
          <label>Lieu d'achat</label>
          <input type="text" id="formPurchaseLocation" placeholder="ex: Discogs France, Fnac, Vide-grenier...">
        </div>
        <div class="form-group">
          <label>Support *</label>
          <select id="formSupport" required>
            <option value="Vinyle">Vinyle</option>
            <option value="CD" selected>CD</option>
            <option value="SACD">SACD</option>
            <option value="WISHLIST">💡 Envie (Wishlist)</option>
          </select>
        </div>
        <div class="form-group">
          <label>URL d'image de la pochette</label>
          <input type="url" id="formCover" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>ID Discogs (numéro de release)</label>
          <input type="text" id="formDiscogsId" placeholder="ex: 1234567">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeFormModal()">Annuler</button>
          <button type="submit" class="btn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let collection = JSON.parse(localStorage.getItem('phonotheque_data')) || [];
    let activeFilter = 'TOUS';
    const DISCOGS_TOKEN = "fOpDVnfmMrEGrhsxwNKmpMWowHnFoXEELIiQCFGj";
    let html5QrCode = null;

    // --- Utilitaire Regex & Formotage ---
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function formatDateFR(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }

    // --- Sauvegarde & Réinitialisation ---
    function saveCollection() {
      localStorage.setItem('phonotheque_data', JSON.stringify(collection));
      render();
    }

    function resetCollection() {
      if (confirm("Effacer TOUS les albums de l'application ?")) {
        collection = [];
        saveCollection();
      }
    }

    // --- 1. Statistiques détaillées sur 2 lignes ---
    function updateStats() {
      const statsElem = document.getElementById('statsCount');
      if (!statsElem) return;

      const total = collection.length;
      const vinyles = collection.filter(a => (a.support || '').toLowerCase() === 'vinyle').length;
      const cds = collection.filter(a => (a.support || '').toLowerCase() === 'cd').length;
      const sacds = collection.filter(a => (a.support || '').toLowerCase() === 'sacd').length;
      const wishlist = collection.filter(a => a.isWishlist || (a.support || '').toUpperCase() === 'WISHLIST').length;

      statsElem.innerHTML = `<strong>${total}</strong> albums<br>${vinyles}&nbsp;Vinyles • ${cds}&nbsp;CD • ${sacds}&nbsp;SACD${wishlist ? ` • 💡&nbsp;${wishlist}` : ''}`;
    }

    // --- 2. Rendu principal & Filtrage / Tri ---
    function render() {
      const container = document.getElementById('mainContainer');
      const searchInput = document.getElementById('searchInput');
      const sortSelect = document.getElementById('sortSelect');
      
      const searchQuery = searchInput ? searchInput.value.trim() : '';
      const sortOption = sortSelect ? sortSelect.value : 'artist';

      container.innerHTML = '';

      let filtered = collection.map((album, idx) => ({ ...album, _id: idx })).filter(album => {
        if (activeFilter === 'WISHLIST') {
          if (!album.isWishlist && (album.support || '').toUpperCase() !== 'WISHLIST') return false;
        } else if (activeFilter !== 'TOUS') {
          if ((album.support || '').toLowerCase() !== activeFilter.toLowerCase()) return false;
        }

        if (!searchQuery) return true;

        const regex = new RegExp(`\\b${escapeRegExp(searchQuery)}\\b`, 'i');
        const matchText = `${album.artist || ''} ${album.title || ''} ${album.conductor || ''} ${album.year || ''} ${album.country || ''} ${album.purchaseLocation || ''}`;
        return regex.test(matchText);
      });

      updateStats();

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted, #a1a1aa); padding: 40px 0; text-align: center;">Aucun album trouvé.<br><br>Clique sur <strong>📤 Importer</strong> pour charger ton CSV ou sur <strong>+</strong> pour ajouter un album.</p>';
        updateAlphabetIndex();
        return;
      }

      if (sortOption === 'artist') {
        const grouped = {};
        filtered.forEach(album => {
          const artistKey = album.artist || 'Artiste Inconnu';
          if (!grouped[artistKey]) grouped[artistKey] = [];
          grouped[artistKey].push(album);
        });

        Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' })).forEach(artistName => {
          const artistAlbums = grouped[artistName];
          artistAlbums.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'fr', { sensitivity: 'base' }));

          const section = document.createElement('div');
          section.className = 'artist-section';
          section.innerHTML = `<div class="artist-header"><span>${artistName}</span><span class="artist-count">(${artistAlbums.length})</span></div><div class="grid"></div>`;
          
          const grid = section.querySelector('.grid');
          artistAlbums.forEach(album => grid.appendChild(createCardElement(album)));
          container.appendChild(section);
        });
      } else {
        filtered.sort((a, b) => {
          if (sortOption === 'yearDesc') return (parseInt(b.year) || 0) - (parseInt(a.year) || 0);
          if (sortOption === 'yearAsc') return (parseInt(a.year) || 0) - (parseInt(b.year) || 0);
          if (sortOption === 'dateAdded') return b._id - a._id;
          return 0;
        });

        const section = document.createElement('div');
        section.className = 'artist-section';
        section.innerHTML = `<div class="grid"></div>`;
        const grid = section.querySelector('.grid');
        filtered.forEach(album => grid.appendChild(createCardElement(album)));
        container.appendChild(section);
      }

      updateAlphabetIndex();
    }

    // --- Génération d'une carte d'album ---
    function createCardElement(album) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openDetailModal(album._id);

      const coverSrc = album.cover 
        ? `https://images.weserv.nl/?url=${encodeURIComponent(album.cover)}` 
        : 'https://via.placeholder.com/150/27272a/a1a1aa?text=Pas+d%27image';

      const supportName = album.support || 'CD';
      const badgeClass = 'badge-' + supportName.toLowerCase();

      const subMetaParts = [];
      if (album.year) subMetaParts.push(album.year);
      if (album.country) {
        subMetaParts.push(`<span class="country-tag" onclick="event.stopPropagation(); filterByCountry('${album.country}')" title="Filtrer par ce pays">${album.country}</span>`);
      }
      const subMetaText = subMetaParts.join(' • ');

      card.innerHTML = `
        <img src="${coverSrc}" alt="Pochette" onerror="this.src='https://via.placeholder.com/150/27272a/a1a1aa?text=Erreur'">
        <div class="card-info">
          <div>
            <span class="badge ${badgeClass}">${supportName}</span>
            <div class="title" title="${album.title}">${album.title}</div>
            ${album.conductor ? `<div class="conductor" title="${album.conductor}">Dir. : ${album.conductor}</div>` : ''}
          </div>
          <div class="card-actions">
            <span class="meta-sub">${subMetaText}</span>
            <div>
              <button class="card-btn-icon" onclick="event.stopPropagation(); openFormModal(${album._id})" title="Modifier">✏️</button>
              <button class="card-btn-icon" onclick="event.stopPropagation(); deleteAlbum(${album._id})" title="Supprimer">🗑️</button>
            </div>
          </div>
        </div>
      `;
      return card;
    }

    // --- Recherche & Filtres ---
    function handleSearchInput() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) {
        clearBtn.style.display = (input && input.value) ? 'block' : 'none';
      }
      render();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      if (input) input.value = '';
      if (clearBtn) clearBtn.style.display = 'none';
      render();
    }

    function filterByCountry(countryName) {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = countryName;
        handleSearchInput();
      }
    }

    function filterSupport(support, btn) {
      activeFilter = support;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      render();
    }

    // --- Modal Détails ---
    function openDetailModal(index) {
      const album = collection[index];
      if (!album) return;

      const coverSrc = album.cover 
        ? `https://images.weserv.nl/?url=${encodeURIComponent(album.cover)}` 
        : 'https://via.placeholder.com/300/27272a/a1a1aa?text=Pas+d%27image';

      const supportName = album.support || 'CD';
      const badgeClass = 'badge-' + supportName.toLowerCase();

      const detailBody = document.getElementById('detailBody');
      detailBody.innerHTML = `
        <img src="${coverSrc}" class="detail-cover" alt="Pochette" onerror="this.src='https://via.placeholder.com/300/27272a/a1a1aa?text=Erreur'">
        <div class="detail-title">${album.title}</div>
        <div class="detail-artist">${album.artist}</div>
        ${album.conductor ? `<div class="detail-conductor">Dir. : ${album.conductor}</div>` : ''}
        
        <div class="detail-meta">
          <div class="detail-meta-item">
            <span class="detail-meta-label">Support :</span>
            <span class="badge ${badgeClass}">${supportName}</span>
          </div>
          ${album.year ? `
          <div class="detail-meta-item">
            <span class="detail-meta-label">Année de sortie :</span>
            <span><strong>${album.year}</strong></span>
          </div>` : ''}
          ${album.country ? `
          <div class="detail-meta-item">
            <span class="detail-meta-label">Pays d'édition :</span>
            <span class="country-tag" onclick="closeDetailModal(); filterByCountry('${album.country}')" title="Filtrer par ce pays"><strong>${album.country}</strong></span>
          </div>` : ''}
          ${album.purchaseDate ? `
          <div class="detail-meta-item">
            <span class="detail-meta-label">Date d'achat :</span>
            <span><strong>${formatDateFR(album.purchaseDate)}</strong></span>
          </div>` : ''}
          ${album.purchasePrice ? `
          <div class="detail-meta-item">
            <span class="detail-meta-label">Prix d'achat :</span>
            <span><strong>${album.purchasePrice} €</strong></span>
          </div>` : ''}
          ${album.purchaseLocation ? `
          <div class="detail-meta-item">
            <span class="detail-meta-label">Lieu d'achat :</span>
            <span><strong>${album.purchaseLocation}</strong></span>
          </div>` : ''}
          ${album.discogsId ? `
           <a href="https://www.discogs.com/release/${album.discogsId}" target="_blank" rel="noopener" class="btn btn-secondary" style="width: 100%; text-decoration: none; margin-top: 8px; margin-bottom: 12px; display: inline-flex; justify-content: center; align-items: center; gap: 6px;">
            🔗 Voir sur Discogs
          </a>` : ''}
        </div>

        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeDetailModal(); openFormModal(${index})">✏️ Modifier</button>
          <button class="btn btn-danger" onclick="deleteAlbum(${index}); closeDetailModal();">🗑️ Supprimer</button>
        </div>
      `;

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetailModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    // --- Modal Formulaire ---
    function openFormModal(index = -1) {
      document.getElementById('editIndex').value = index;
      
      const dateElem = document.getElementById('formPurchaseDate');
      const priceElem = document.getElementById('formPurchasePrice');
      const locationElem = document.getElementById('formPurchaseLocation');

      if (index >= 0) {
        const album = collection[index];
        document.getElementById('formModalTitle').innerText = "Modifier l'album";
        document.getElementById('formArtist').value = album.artist || '';
        document.getElementById('formTitle').value = album.title || '';
        document.getElementById('formConductor').value = album.conductor || '';
        document.getElementById('formYear').value = album.year || '';
        document.getElementById('formCountry').value = album.country || '';
        if (dateElem) dateElem.value = album.purchaseDate || '';
        if (priceElem) priceElem.value = album.purchasePrice || '';
        if (locationElem) locationElem.value = album.purchaseLocation || '';
        document.getElementById('formSupport').value = album.support || 'CD';
        document.getElementById('formCover').value = album.cover || '';
        if (document.getElementById('formDiscogsId')) {
          document.getElementById('formDiscogsId').value = album.discogsId || '';
        }
      } else {
        document.getElementById('formModalTitle').innerText = "Ajouter un album";
        document.getElementById('albumForm').reset();
        if (dateElem) dateElem.value = '';
        if (priceElem) priceElem.value = '';
        if (locationElem) locationElem.value = '';
      }
      document.getElementById('formModal').style.display = 'flex';
    }

    function closeFormModal() {
      document.getElementById('formModal').style.display = 'none';
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const index = parseInt(document.getElementById('editIndex').value, 10);
      
      const discogsInput = document.getElementById('formDiscogsId');
      const existingDiscogsId = (index >= 0 && collection[index]) ? (collection[index].discogsId || '') : '';
      const supportVal = document.getElementById('formSupport').value;

      const dateElem = document.getElementById('formPurchaseDate');
      const priceElem = document.getElementById('formPurchasePrice');
      const locationElem = document.getElementById('formPurchaseLocation');

      const newAlbum = {
        artist: document.getElementById('formArtist').value.trim(),
        title: document.getElementById('formTitle').value.trim(),
        conductor: document.getElementById('formConductor').value.trim(),
        year: document.getElementById('formYear').value.trim(),
        country: document.getElementById('formCountry').value.trim(),
        purchaseDate: dateElem ? dateElem.value : '',
        purchasePrice: priceElem ? priceElem.value.trim() : '',
        purchaseLocation: locationElem ? locationElem.value.trim() : '',
        support: supportVal,
        cover: document.getElementById('formCover').value.trim(),
        discogsId: discogsInput ? discogsInput.value.trim() : existingDiscogsId,
        isWishlist: supportVal === 'WISHLIST'
      };

      if (index < 0) {
        const isDuplicate = collection.some(a => 
          (newAlbum.discogsId && a.discogsId && String(a.discogsId) === String(newAlbum.discogsId)) ||
          (a.artist.toLowerCase() === newAlbum.artist.toLowerCase() && a.title.toLowerCase() === newAlbum.title.toLowerCase())
        );

        if (isDuplicate) {
          if (!confirm(`⚠️ "${newAlbum.title}" de ${newAlbum.artist} existe déjà dans ta phonothèque.\n\nVeux-tu quand même l'ajouter à nouveau ?`)) {
            return;
          }
        }
      }

      if (index >= 0) {
        collection[index] = newAlbum;
      } else {
        collection.push(newAlbum);
      }

      saveCollection();
      closeFormModal();
    }

    function deleteAlbum(index) {
      const album = collection[index];
      if (!album) return;
      if (confirm(`Supprimer "${album.title}" de ${album.artist} ?`)) {
        collection.splice(index, 1);
        saveCollection();
      }
    }

    function pickRandom() {
      if (!collection.length) return alert("Collection vide !");
      const randomIndex = Math.floor(Math.random() * collection.length);
      openDetailModal(randomIndex);
    }

    // --- Discogs & Scanner ---
    async function toggleScanner() {
      const readerDiv = document.getElementById('qr-reader');
      if (!readerDiv) return;

      if (html5QrCode && html5QrCode.isScanning) {
        await stopScanner();
        return;
      }

      readerDiv.style.display = 'block';
      html5QrCode = new Html5Qrcode("qr-reader");

      const config = { fps: 10, qrbox: { width: 250, height: 150 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        alert("Impossible d'accéder à la caméra : " + err);
        readerDiv.style.display = 'none';
      });
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
        const readerDiv = document.getElementById('qr-reader');
        if (readerDiv) readerDiv.style.display = 'none';
      }
    }

    function onScanSuccess(decodedText) {
      stopScanner();
      searchDiscogsAuto(decodedText.trim());
    }

    function searchDiscogsAuto(queryOverride) {
      const manualInput = document.getElementById('manualQuery');
      const query = queryOverride || (manualInput ? manualInput.value.trim() : '');
      if (!query) {
        alert("Veuillez saisir un code-barres ou une référence d'album.");
        return;
      }

      const url = `https://api.discogs.com/database/search?q=${encodeURIComponent(query)}&token=${DISCOGS_TOKEN}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.results || data.results.length === 0) {
            alert(`Aucun album trouvé sur Discogs pour : ${query}`);
            return;
          }

          const result = data.results[0];

          let artist = 'Artiste inconnu';
          let title = result.title || '';

          if (result.title && result.title.includes(' - ')) {
            const parts = result.title.split(' - ');
            artist = parts[0].trim();
            title = parts.slice(1).join(' - ').trim();
          }

          const existing = collection.find(a => 
            (a.discogsId && String(a.discogsId) === String(result.id)) ||
            (a.artist.toLowerCase() === artist.toLowerCase() && a.title.toLowerCase() === title.toLowerCase())
          );

          if (existing) {
            alert(`⚠️ Cet album est déjà dans ta phonothèque !\n\n"${existing.title}" par ${existing.artist} (${existing.support || 'CD'})`);
          }

          document.getElementById('formArtist').value = artist;
          document.getElementById('formTitle').value = title;
          document.getElementById('formYear').value = result.year || '';
          document.getElementById('formCountry').value = result.country || '';
          if (document.getElementById('formDiscogsId')) {
            document.getElementById('formDiscogsId').value = result.id || '';
          }

          if (result.cover_image) {
            document.getElementById('formCover').value = result.cover_image;
          }

          if (result.format && Array.isArray(result.format)) {
            const fmtStr = result.format.join(' ').toLowerCase();
            if (fmtStr.includes('vinyl') || fmtStr.includes('vinyle')) {
              document.getElementById('formSupport').value = 'Vinyle';
            } else if (fmtStr.includes('sacd')) {
              document.getElementById('formSupport').value = 'SACD';
            } else {
              document.getElementById('formSupport').value = 'CD';
            }
          }
        })
        .catch(err => {
          alert("Erreur lors de la recherche Discogs : " + err);
        });
    }

    // --- Export / Import CSV ---
    function exportToCSV() {
      let list = [];
      if (typeof collection !== 'undefined' && Array.isArray(collection) && collection.length > 0) {
        list = collection;
      } else {
        const stored = localStorage.getItem('phonotheque_data') || localStorage.getItem('phonotheque');
        if (stored) {
          try { list = JSON.parse(stored); } catch(e) {}
        }
      }

      if (!list || list.length === 0) {
        alert("Votre phonothèque est vide, aucun album à exporter.");
        return;
      }

      const headers = ["Artiste", "Titre", "Chef d'orchestre", "Année", "Pays", "DateAchat", "PrixAchat", "LieuAchat", "Support", "DiscogsID", "Pochette"];
      const rows = list.map(a => [
        `"${(a.artist || '').toString().replace(/"/g, '""')}"`,
        `"${(a.title || '').toString().replace(/"/g, '""')}"`,
        `"${(a.conductor || '').toString().replace(/"/g, '""')}"`,
        `"${(a.year || '').toString().replace(/"/g, '""')}"`,
        `"${(a.country || '').toString().replace(/"/g, '""')}"`,
        `"${(a.purchaseDate || '').toString().replace(/"/g, '""')}"`,
        `"${(a.purchasePrice || '').toString().replace(/"/g, '""')}"`,
        `"${(a.purchaseLocation || '').toString().replace(/"/g, '""')}"`,
        `"${(a.support || '').toString().replace(/"/g, '""')}"`,
        `"${(a.discogsId || '').toString().replace(/"/g, '""')}"`,
        `"${(a.cover || '').toString().replace(/"/g, '""')}"`
      ]);

      const csvContent = "\uFEFF" + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const today = new Date().toISOString().split('T')[0];
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `phonotheque_backup_${today}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let inQuotes = false;
      
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const nextC = text[i+1];
        
        if (c === '"' && inQuotes && nextC === '"') {
          currentVal += '"';
          i++;
        } else if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          currentRow.push(currentVal);
          currentVal = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && nextC === '\n') { i++; }
          currentRow.push(currentVal);
          currentVal = '';
          if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
        } else {
          currentVal += c;
        }
      }
      if (currentVal !== '' || currentRow.length > 0) {
        currentRow.push(currentVal);
        rows.push(currentRow);
      }
      return rows;
    }

    function importFromCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        let newAlbums = [];

        if (text.includes(";")) {
          const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length > 1) {
            for (let i = 1; i < lines.length; i++) {
              const cols = lines[i].split(";").map(col => col.replace(/^"|"$/g, '').replace(/""/g, '"'));
              if (cols.length >= 2) {
                newAlbums.push({
                  artist: cols[0] || '',
                  title: cols[1] || '',
                  conductor: cols[2] || '',
                  year: cols[3] || '',
                  country: cols[4] || '',
                  purchaseDate: cols[5] || '',
                  purchasePrice: cols[6] || '',
                  purchaseLocation: cols[7] || '',
                  support: cols[8] || 'CD',
                  discogsId: cols[9] || '',
                  cover: cols[10] || ''
                });
              }
            }
          }
        } else {
          const rows = parseCSV(text);
          if (rows.length > 1) {
            const headers = rows[0].map(h => h.trim());
            const titleIdx = headers.indexOf('Title');
            const artistIdx = headers.indexOf('Artist');
            const mediaIdx = headers.indexOf('Media');
            const conductorIdx = headers.indexOf('Conductors');
            const yearIdx = headers.indexOf('Release Year');
            const countryIdx = headers.indexOf('Country');
            const discogsIdx = headers.indexOf('discogs Release ID');
            const coverIdx = headers.indexOf('Uploaded Image URL');

            for (let i = 1; i < rows.length; i++) {
              const cols = rows[i];
              const title = titleIdx !== -1 && cols[titleIdx] ? cols[titleIdx].trim() : (cols[1] || '');
              const artist = artistIdx !== -1 && cols[artistIdx] ? cols[artistIdx].trim() : (cols[0] || '');
              if (!title && !artist) continue;

              let support = (mediaIdx !== -1 && cols[mediaIdx]) ? cols[mediaIdx] : 'CD';
              if (support.includes('Vinyl') || support.includes('Vinyle')) support = 'Vinyle';
              else if (support.includes('SACD')) support = 'SACD';
              else support = 'CD';

              newAlbums.push({
                title: title || 'Sans titre',
                artist: artist || 'Artiste inconnu',
                conductor: conductorIdx !== -1 && cols[conductorIdx] ? cols[conductorIdx].trim() : '',
                year: yearIdx !== -1 && cols[yearIdx] ? cols[yearIdx].trim() : '',
                country: countryIdx !== -1 && cols[countryIdx] ? cols[countryIdx].trim() : '',
                purchaseDate: '',
                purchasePrice: '',
                purchaseLocation: '',
                discogsId: discogsIdx !== -1 && cols[discogsIdx] ? cols[discogsIdx].trim() : '',
                support: support,
                cover: coverIdx !== -1 && cols[coverIdx] ? cols[coverIdx].trim() : ''
              });
            }
          }
        }

        if (newAlbums.length > 0) {
          if (confirm(`Voulez-vous importer ${newAlbums.length} album(s) ?`)) {
            collection = newAlbums;
            saveCollection();
            alert("Importation réussie !");
          }
        } else {
          alert("Aucun album valide trouvé dans le fichier.");
        }
      };
      reader.readAsText(file, "UTF-8");
      event.target.value = '';
    }

    // --- Index alphabétique A-Z ---
    function updateAlphabetIndex() {
      const container = document.getElementById('alphabet-index');
      if (!container) return;

      if (!collection || collection.length === 0) {
        container.innerHTML = '';
        container.style.display = 'none';
        return;
      }
      container.style.display = 'flex';

      const activeLetters = [...new Set(collection.map(album => {
        const artistName = (album.artist || '').trim();
        const firstChar = artistName.charAt(0).toUpperCase();
        return /[A-Z]/.test(firstChar) ? firstChar : '#';
      }))].sort();

      container.innerHTML = activeLetters.map(letter => `
        <button class="index-letter" onclick="scrollToLetter('${letter}')">${letter}</button>
      `).join('');
    }

    function scrollToLetter(letter) {
      const headers = Array.from(document.querySelectorAll('.artist-section, h2, h3'));
      const target = headers.find(el => {
        const text = el.textContent.trim().toUpperCase();
        if (letter === '#') {
          return !/^[A-Z]/.test(text.charAt(0));
        }
        return text.startsWith(letter);
      });

      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Premier affichage
    render();
  </script>
