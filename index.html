<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phonothèque</title>
  
  <!-- PWA & Apple Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phonothèque">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/vinyl.png">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #2a2a2a;
      --accent-blue: #2563eb;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --badge-vinyle: #d97706;
      --badge-cd: #2563eb;
      --badge-sacd: #0d9488;
      --badge-coffret: #8b5cf6;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 15px 80px 15px;
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .btn-add {
      background: var(--accent-blue);
      border: none;
      color: white;
      font-weight: bold;
    }

    .stats-line {
      font-size: 13px;
      color: var(--text-sub);
    }

    .io-bar {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      margin-bottom: 15px;
    }

    .btn-secondary {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-danger-soft {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    /* Barre de recherche */
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    input[type="text"], input[type="number"], input[type="date"], input[type="url"], select, textarea {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: #3a3a3c;
      color: var(--text-sub);
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .filters-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
      scrollbar-width: none;
    }
    .filters-scroll::-webkit-scrollbar { display: none; }

    .filter-chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--text-main);
      color: var(--bg-color);
      border-color: var(--text-main);
    }

    .artist-group-header {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-blue);
      margin: 20px 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .artist-count {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: normal;
    }

    .album-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      position: relative;
      cursor: pointer;
    }

    .cover-box {
      width: 75px;
      height: 75px;
      border-radius: 10px;
      background: #2a2a2a;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 10px;
      text-align: center;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 40px;
    }

    .album-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .album-sub {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.3;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: white;
      margin-bottom: 4px;
      width: fit-content;
    }

    .badge-vinyle { background: var(--badge-vinyle); }
    .badge-cd { background: var(--badge-cd); }
    .badge-sacd { background: var(--badge-sacd); }
    .badge-coffret { background: var(--badge-coffret); }

    .card-actions {
      position: absolute;
      right: 12px;
      bottom: 12px;
    }

    .card-action-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 16px;
      cursor: pointer;
    }

    .az-index {
      position: fixed;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1px;
      z-index: 10;
      font-size: 9px;
      font-weight: bold;
      color: var(--text-sub);
      background: rgba(18, 18, 18, 0.75);
      padding: 4px 2px;
      border-radius: 10px;
      backdrop-filter: blur(5px);
    }

    .az-index a {
      color: inherit;
      text-decoration: none;
      text-align: center;
      width: 14px;
    }

    /* Fenêtres Modales avec en-tête STRICTEMENT FIXE */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 650px;
      height: 82vh;
      max-height: 82dvh;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--card-border);
      overflow: hidden;
    }

    .modal-header {
      flex-shrink: 0;
      height: 58px;
      padding: 0 20px;
      background: #2c2c2e;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 20px 20px 0 0;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: white;
    }

    .modal-close {
      background: #3a3a3c;
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .details-grid {
      background: #2c2c2e;
      border-radius: 14px;
      padding: 14px;
      margin: 15px 0;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #3a3a3c;
      font-size: 14px;
    }

    .details-row:last-child { border-bottom: none; }
    .details-label { color: var(--text-sub); white-space: nowrap; flex-shrink: 0; }
    .details-val { font-weight: 600; text-align: right; word-break: break-word; }

    .modal-cover {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 16px;
      background: #121212;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #2c2c2e;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent-blue);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    .btn-danger { background: var(--danger); }

    .volumes-box {
      background: #2c2c2e;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }

    .volume-item {
      background: #1c1c1e;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <h1>Phonothèque</h1>
      <div class="header-actions">
        <button class="icon-btn" onclick="getRandomAlbum()" title="Album au hasard">🎲</button>
        <button class="icon-btn btn-add" onclick="openAddModal()">+</button>
      </div>
    </div>
    <div class="stats-line" id="statsLine">Chargement des albums...</div>

    <div class="io-bar">
      <button class="btn-secondary" onclick="exportToCSV()">📤 Exporter</button>
      <button class="btn-secondary" onclick="document.getElementById('csvInput').click()">📥 Importer</button>
      <button class="btn-secondary btn-danger-soft" onclick="clearCollection()">🗑️ Vider</button>
      <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="importFromCSV(event)">
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher titre, artiste, éditeur, chef, BWV..." oninput="onSearchInput()">
      <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearch()">✕</button>
    </div>

    <div class="filters-scroll">
      <button class="filter-chip active" onclick="setFilter('all', this)">Tous</button>
      <button class="filter-chip" onclick="setFilter('Vinyle', this)">Vinyles</button>
      <button class="filter-chip" onclick="setFilter('CD', this)">CD</button>
      <button class="filter-chip" onclick="setFilter('SACD', this)">SACD</button>
      <button class="filter-chip" onclick="setFilter('Coffret', this)">📦 Coffrets</button>
    </div>
  </header>

  <main id="collectionContainer"></main>

  <div class="az-index" id="azIndex"></div>

  <!-- MODALE DETAILS -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalDetailTitle">Détails de l'album</span>
        <button class="modal-close" onclick="closeModal('detailsModal')">✕</button>
      </div>
      <div class="modal-body">
        <img id="modalDetailCover" class="modal-cover" src="" alt="Pochette">
        <h2 id="modalDetailAlbumName" style="font-size: 20px;"></h2>
        <h3 id="modalDetailArtist" style="font-size: 15px; color: var(--accent-blue); margin-bottom: 10px;"></h3>

        <div class="details-grid">
          <div class="details-row"><span class="details-label">Support :</span><span class="details-val" id="modalDetailSupport"></span></div>
          <div class="details-row" id="rowLabel"><span class="details-label">Éditeur / Label :</span><span class="details-val" id="modalDetailLabel"></span></div>
          <div class="details-row"><span class="details-label">Année de sortie :</span><span class="details-val" id="modalDetailYear"></span></div>
          <div class="details-row"><span class="details-label">Pays d'édition :</span><span class="details-val" id="modalDetailCountry"></span></div>
          <div class="details-row" id="rowConductor"><span class="details-label">Chef d'orchestre :</span><span class="details-val" id="modalDetailConductor"></span></div>
          <div class="details-row"><span class="details-label">Date d'achat :</span><span class="details-val" id="modalDetailDate"></span></div>
          <div class="details-row"><span class="details-label">Prix d'achat :</span><span class="details-val" id="modalDetailPrice"></span></div>
          <div class="details-row"><span class="details-label">Lieu d'achat :</span><span class="details-val" id="modalDetailLocation"></span></div>
        </div>

        <div id="volumesSection" style="display:none; margin-bottom: 15px;">
          <h3 style="font-size: 15px; margin-bottom: 8px;">Contenu du coffret / Liste des volumes :</h3>
          <input type="text" id="volumeSearch" placeholder="Filtrer un volume, cantate, BWV..." oninput="filterVolumes()" style="margin-bottom: 8px; font-size: 13px;">
          <div class="volumes-box" id="volumesList"></div>
        </div>

        <div style="display:flex; gap: 10px; margin-top: 15px;">
          <a id="discogsLink" target="_blank" class="btn-secondary" style="text-decoration:none; display:none;">🔗 Voir sur Discogs</a>
        </div>

        <div style="display:flex; gap: 10px; margin-top: 20px;">
          <button class="btn-secondary" style="flex:1" onclick="editCurrentAlbum()">✏️ Modifier</button>
          <button class="btn-secondary btn-danger" style="color:white;" onclick="deleteCurrentAlbum()">🗑️ Supprimer</button>
        </div>

        <button class="btn-secondary" style="width:100%; margin-top:15px;" onclick="closeModal('detailsModal')">✕ Fermer la fenêtre</button>
      </div>
    </div>
  </div>

  <!-- MODALE AJOUT / EDITION -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="formModalTitle">Ajouter un album</span>
        <button class="modal-close" onclick="closeModal('formModal')">✕</button>
      </div>
      <div class="modal-body">
        <form id="albumForm" onsubmit="saveAlbumForm(event)">
          
          <div class="checkbox-group">
            <input type="checkbox" id="isBoxSet" onchange="toggleBoxSetFields()">
            <label for="isBoxSet" style="text-transform:none; font-size:14px; color:white; cursor:pointer;">Il s'agit d'un coffret / série (multi-volumes)</label>
          </div>

          <div class="form-group">
            <label>Titre de l'album / du coffret *</label>
            <input type="text" id="formTitle" required placeholder="ex: Les Cantates, Vol. 1 à 45">
          </div>

          <div class="form-group">
            <label>Artiste *</label>
            <input type="text" id="formArtist" required placeholder="ex: Johann Sebastian Bach">
          </div>

          <div class="form-group">
            <label>Éditeur / Label</label>
            <input type="text" id="formLabel" placeholder="ex: Telefunken, Mofi, Barclay, Deutsche Grammophon...">
          </div>

          <div class="form-group">
            <label>Chef d'orchestre / Interprète</label>
            <input type="text" id="formConductor" placeholder="ex: Nikolaus Harnoncourt">
          </div>

          <div class="form-row">
            <div class="form-group" style="flex:1">
              <label>Support</label>
              <select id="formSupport">
                <option value="Vinyle">Vinyle</option>
                <option value="CD">CD</option>
                <option value="SACD">SACD</option>
              </select>
            </div>
            <div class="form-group" style="flex:1">
              <label>Année</label>
              <input type="text" id="formYear" placeholder="ex: 1972">
            </div>
          </div>

          <div class="form-group">
            <label>Pays d'édition</label>
            <input type="text" id="formCountry" placeholder="ex: Allemagne">
          </div>

          <div class="form-row">
            <div class="form-group" style="flex:1">
              <label>Date d'achat</label>
              <input type="text" id="formPurchaseDate" placeholder="ex: 2026-08-23">
            </div>
            <div class="form-group" style="flex:1">
              <label>Prix d'achat (€)</label>
              <input type="text" id="formPurchasePrice" placeholder="ex: 120">
            </div>
          </div>

          <div class="form-group">
            <label>Lieu d'achat</label>
            <input type="text" id="formPurchaseLocation" placeholder="ex: Discogs, FNAC St Lazare...">
          </div>

          <div class="form-group">
            <label>ID Discogs</label>
            <input type="text" id="formDiscogsId" placeholder="ex: 6083236">
            <button type="button" class="btn-secondary" style="margin-top:8px; width:100%;" onclick="scanBarcodeOrFetchDiscogs()">📷 Scanner / Auto-remplir Discogs</button>
          </div>

          <div class="form-group">
            <label>URL de la pochette</label>
            <input type="url" id="formCover" placeholder="https://...">
          </div>

          <div class="form-group" id="boxSetFieldsGroup" style="display:none;">
            <label>Liste des volumes (Un volume par ligne)</label>
            <textarea id="formVolumesText" rows="6" placeholder="Vol. 1 - Cantates BWV 1 à 4&#10;Vol. 2 - Cantates BWV 5 à 8&#10;Vol. 3 - Cantates BWV 9 à 11"></textarea>
          </div>

          <button type="submit" class="btn-submit">Enregistrer dans la Phonothèque</button>
          <button type="button" class="btn-secondary" style="width:100%; margin-top:10px;" onclick="closeModal('formModal')">✕ Annuler</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSy_REPLACE_WITH_YOUR_KEY",
      authDomain: "phonotheque-app.firebaseapp.com",
      projectId: "phonotheque-app",
      storageBucket: "phonotheque-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abc123def456"
    };

    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) { console.log("Mode local"); }

    let collection = [];
    let currentFilter = 'all';
    let selectedAlbumIndex = -1;

    function initApp() {
      loadLocal();

      if (db) {
        db.collection("phonotheque").doc("main").onSnapshot(doc => {
          if (doc.exists && doc.data().list) {
            collection = doc.data().list;
            localStorage.setItem("phonotheque_backup", JSON.stringify(collection));
            renderCollection();
          }
        }, err => console.log("Données locales conservées"));
      }
    }

    function loadLocal() {
      const data = localStorage.getItem("phonotheque_backup");
      if (data) collection = JSON.parse(data);
      renderCollection();
    }

    function saveCollection() {
      localStorage.setItem("phonotheque_backup", JSON.stringify(collection));
      if (db) {
        db.collection("phonotheque").doc("main").set({ list: collection })
          .catch(err => console.log("Erreur synchro cloud"));
      }
      renderCollection();
    }

    function clearCollection() {
      if (confirm("ATTENTION : Voulez-vous vraiment vider toute votre phonothèque ?")) {
        collection = [];
        saveCollection();
        alert("La phonothèque a été vidée.");
      }
    }

    function renderCollection() {
      const container = document.getElementById("collectionContainer");
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      container.innerHTML = "";

      let countVinyle = 0, countCD = 0, countSACD = 0, countCoffret = 0;
      collection.forEach(a => {
        if (a.isBoxSet) countCoffret++;
        else if (a.support === 'Vinyle') countVinyle++;
        else if (a.support === 'CD') countCD++;
        else if (a.support === 'SACD') countSACD++;
      });

      document.getElementById("statsLine").innerHTML = 
        `${collection.length} références • ${countVinyle} Vinyles • ${countCD} CD • ${countSACD} SACD • ${countCoffret} Coffrets`;

      let filtered = collection.filter((album) => {
        if (currentFilter === 'Coffret' && !album.isBoxSet) return false;
        if (currentFilter !== 'all' && currentFilter !== 'Coffret' && album.support !== currentFilter) return false;

        if (search) {
          const matchTitle = (album.title || '').toLowerCase().includes(search);
          const matchArtist = (album.artist || '').toLowerCase().includes(search);
          const matchLabel = (album.label || '').toLowerCase().includes(search);
          const matchConductor = (album.conductor || '').toLowerCase().includes(search);
          const matchVolumes = album.volumes && album.volumes.some(v => v.toLowerCase().includes(search));
          return matchTitle || matchArtist || matchLabel || matchConductor || matchVolumes;
        }
        return true;
      });

      filtered.sort((a, b) => (a.artist || '').localeCompare(b.artist || '', 'fr', {sensitivity: 'base'}));

      let groups = {};
      filtered.forEach((album) => {
        const artist = album.artist || 'Artiste inconnu';
        if (!groups[artist]) groups[artist] = [];
        groups[artist].push(album);
      });

      renderAZIndex(Object.keys(groups));

      Object.keys(groups).forEach(artist => {
        const artistId = 'artist-' + artist.replace(/[^a-zA-Z0-9]/g, '');
        const groupHeader = document.createElement("div");
        groupHeader.className = "artist-group-header";
        groupHeader.id = artistId;
        groupHeader.innerHTML = `${artist} <span class="artist-count">(${groups[artist].length})</span>`;
        container.appendChild(groupHeader);

        groups[artist].forEach((album) => {
          const realIndex = collection.indexOf(album);
          const card = document.createElement("div");
          card.className = "album-card";
          card.onclick = (e) => {
            if (!e.target.classList.contains('card-action-btn')) showDetails(realIndex);
          };

          let badgeClass = 'badge-cd';
          let badgeText = album.support || 'CD';
          if (album.isBoxSet) {
            badgeClass = 'badge-coffret';
            badgeText = `COFFRET (${album.volumes ? album.volumes.length : 0} VOL.)`;
          } else if (album.support === 'Vinyle') badgeClass = 'badge-vinyle';
          else if (album.support === 'SACD') badgeClass = 'badge-sacd';

          const coverSrc = album.cover && album.cover.startsWith('http') ? album.cover : '';

          let subParts = [];
          if (album.label) subParts.push(album.label);
          if (album.year) subParts.push(album.year);
          if (album.country) subParts.push(album.country);
          const subText = subParts.join(' • ');

          card.innerHTML = `
            <div class="cover-box">
              ${coverSrc ? `<img src="${coverSrc}" alt="cover" onerror="this.style.display='none'">` : 'Pochette'}
            </div>
            <div class="album-info">
              <span class="badge ${badgeClass}">${badgeText}</span>
              <div class="album-title">${album.title || 'Sans titre'}</div>
              <div class="album-sub">${subText}</div>
            </div>
            <div class="card-actions">
              <button class="card-action-btn" onclick="openEditModal(${realIndex})">✏️</button>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function renderAZIndex(artists) {
      const az = document.getElementById("azIndex");
      az.innerHTML = "";
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      letters.forEach(l => {
        const matching = artists.find(a => a.toUpperCase().startsWith(l));
        const a = document.createElement("a");
        a.textContent = l;
        if (matching) {
          a.href = "#artist-" + matching.replace(/[^a-zA-Z0-9]/g, '');
          a.style.opacity = "1";
        } else {
          a.style.opacity = "0.2";
        }
        az.appendChild(a);
      });
    }

    function onSearchInput() {
      const val = document.getElementById("searchInput").value;
      document.getElementById("searchClearBtn").style.display = val ? "flex" : "none";
      renderCollection();
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      document.getElementById("searchClearBtn").style.display = "none";
      renderCollection();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderCollection();
    }

    function showDetails(index) {
      selectedAlbumIndex = index;
      const album = collection[index];

      document.getElementById("modalDetailTitle").textContent = album.isBoxSet ? "Détails du Coffret" : "Détails de l'album";
      document.getElementById("modalDetailAlbumName").textContent = album.title || '';
      document.getElementById("modalDetailArtist").textContent = album.artist || '';
      document.getElementById("modalDetailSupport").textContent = album.isBoxSet ? `Coffret (${album.support})` : album.support;
      
      const labelRow = document.getElementById("rowLabel");
      if (album.label) {
        labelRow.style.display = 'flex';
        document.getElementById("modalDetailLabel").textContent = album.label;
      } else { labelRow.style.display = 'none'; }

      document.getElementById("modalDetailYear").textContent = album.year || '-';
      document.getElementById("modalDetailCountry").textContent = album.country || '-';
      
      const condRow = document.getElementById("rowConductor");
      if (album.conductor) {
        condRow.style.display = 'flex';
        document.getElementById("modalDetailConductor").textContent = album.conductor;
      } else { condRow.style.display = 'none'; }

      document.getElementById("modalDetailDate").textContent = album.purchaseDate || '-';
      document.getElementById("modalDetailPrice").textContent = album.purchasePrice ? `${album.purchasePrice} €` : '-';
      document.getElementById("modalDetailLocation").textContent = album.purchaseLocation || '-';

      const coverImg = document.getElementById("modalDetailCover");
      if (album.cover && album.cover.startsWith('http')) {
        coverImg.src = album.cover;
        coverImg.style.display = 'block';
      } else { coverImg.style.display = 'none'; }

      const discogsBtn = document.getElementById("discogsLink");
      if (album.discogsId) {
        discogsBtn.href = `https://www.discogs.com/release/${album.discogsId}`;
        discogsBtn.style.display = 'inline-flex';
      } else { discogsBtn.style.display = 'none'; }

      const volSection = document.getElementById("volumesSection");
      if (album.isBoxSet && album.volumes && album.volumes.length > 0) {
        volSection.style.display = 'block';
        renderVolumesList(album.volumes);
      } else { volSection.style.display = 'none'; }

      document.getElementById("detailsModal").classList.add("active");
    }

    function renderVolumesList(vols) {
      const box = document.getElementById("volumesList");
      const search = document.getElementById("volumeSearch").value.toLowerCase();
      box.innerHTML = "";
      vols.forEach((v) => {
        if (!search || v.toLowerCase().includes(search)) {
          const item = document.createElement("div");
          item.className = "volume-item";
          item.textContent = v;
          box.appendChild(item);
        }
      });
    }

    function filterVolumes() {
      if (selectedAlbumIndex !== -1 && collection[selectedAlbumIndex].volumes) {
        renderVolumesList(collection[selectedAlbumIndex].volumes);
      }
    }

    function toggleBoxSetFields() {
      const isChecked = document.getElementById("isBoxSet").checked;
      document.getElementById("boxSetFieldsGroup").style.display = isChecked ? 'block' : 'none';
    }

    function openAddModal() {
      selectedAlbumIndex = -1;
      document.getElementById("formModalTitle").textContent = "Ajouter un album / coffret";
      document.getElementById("albumForm").reset();
      document.getElementById("isBoxSet").checked = false;
      toggleBoxSetFields();
      document.getElementById("formModal").classList.add("active");
    }

    function openEditModal(index) {
      selectedAlbumIndex = index;
      const album = collection[index];
      document.getElementById("formModalTitle").textContent = "Modifier la référence";
      
      document.getElementById("isBoxSet").checked = !!album.isBoxSet;
      toggleBoxSetFields();

      document.getElementById("formTitle").value = album.title || '';
      document.getElementById("formArtist").value = album.artist || '';
      document.getElementById("formLabel").value = album.label || '';
      document.getElementById("formConductor").value = album.conductor || '';
      document.getElementById("formSupport").value = album.support || 'Vinyle';
      document.getElementById("formYear").value = album.year || '';
      document.getElementById("formCountry").value = album.country || '';
      document.getElementById("formPurchaseDate").value = album.purchaseDate || '';
      document.getElementById("formPurchasePrice").value = album.purchasePrice || '';
      document.getElementById("formPurchaseLocation").value = album.purchaseLocation || '';
      document.getElementById("formDiscogsId").value = album.discogsId || '';
      document.getElementById("formCover").value = album.cover || '';

      if (album.volumes) {
        document.getElementById("formVolumesText").value = album.volumes.join('\n');
      } else { document.getElementById("formVolumesText").value = ''; }

      closeModal("detailsModal");
      document.getElementById("formModal").classList.add("active");
    }

    function saveAlbumForm(e) {
      e.preventDefault();
      const isBoxSet = document.getElementById("isBoxSet").checked;
      const volsRaw = document.getElementById("formVolumesText").value;
      const volumes = isBoxSet ? volsRaw.split('\n').map(v => v.trim()).filter(v => v.length > 0) : [];

      const albumData = {
        title: document.getElementById("formTitle").value,
        artist: document.getElementById("formArtist").value,
        label: document.getElementById("formLabel").value,
        conductor: document.getElementById("formConductor").value,
        support: document.getElementById("formSupport").value,
        year: document.getElementById("formYear").value,
        country: document.getElementById("formCountry").value,
        purchaseDate: document.getElementById("formPurchaseDate").value,
        purchasePrice: document.getElementById("formPurchasePrice").value,
        purchaseLocation: document.getElementById("formPurchaseLocation").value,
        discogsId: document.getElementById("formDiscogsId").value,
        cover: document.getElementById("formCover").value,
        isBoxSet: isBoxSet,
        volumes: volumes
      };

      if (selectedAlbumIndex >= 0) {
        collection[selectedAlbumIndex] = albumData;
      } else {
        collection.unshift(albumData);
      }

      saveCollection();
      closeModal("formModal");
    }

    async function scanBarcodeOrFetchDiscogs() {
      const id = document.getElementById("formDiscogsId").value.trim();
      if (!id) {
        const input = prompt("Saisissez un ID de sortie Discogs ou un code-barres (EAN) :");
        if (!input) return;
        document.getElementById("formDiscogsId").value = input.trim();
      }
      
      const cleanId = document.getElementById("formDiscogsId").value.trim();
      try {
        const res = await fetch(`https://api.discogs.com/releases/${cleanId}`);
        if (!res.ok) throw new Error("Erreur");
        const data = await res.json();

        if (data.title) document.getElementById("formTitle").value = data.title;
        if (data.artists && data.artists.length) {
          document.getElementById("formArtist").value = data.artists.map(a => a.name.replace(/\s*\(\d+\)$/, '')).join(', ');
        }
        if (data.labels && data.labels.length) document.getElementById("formLabel").value = data.labels[0].name;
        if (data.year) document.getElementById("formYear").value = data.year;
        if (data.country) document.getElementById("formCountry").value = data.country;
        if (data.images && data.images.length) document.getElementById("formCover").value = data.images[0].resource_url || data.images[0].uri;

        alert("Données récupérées depuis Discogs avec succès !");
      } catch(e) {
        alert("Impossible de charger les données automatiquement. Vérifiez l'ID Discogs.");
      }
    }

    function editCurrentAlbum() {
      if (selectedAlbumIndex !== -1) openEditModal(selectedAlbumIndex);
    }

    function deleteCurrentAlbum() {
      if (selectedAlbumIndex !== -1 && confirm("Voulez-vous vraiment supprimer cette référence ?")) {
        collection.splice(selectedAlbumIndex, 1);
        saveCollection();
        closeModal("detailsModal");
      }
    }

    function getRandomAlbum() {
      if (collection.length === 0) return;
      const idx = Math.floor(Math.random() * collection.length);
      showDetails(idx);
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    function parseCSV(text) {
      let rows = [], currentRow = [], currentVal = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i], nextC = text[i+1] || '';
        if (c === '"' && inQuotes && nextC === '"') { currentVal += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { currentRow.push(currentVal); currentVal = ''; }
        else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && nextC === '\n') i++;
          currentRow.push(currentVal); currentVal = '';
          if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) rows.push(currentRow);
          currentRow = [];
        } else { currentVal += c; }
      }
      if (currentVal !== '' || currentRow.length > 0) { currentRow.push(currentVal); rows.push(currentRow); }
      return rows;
    }

    function cleanImportDate(val) {
      if (!val) return '';
      val = val.trim().replace(/\//g, '-');
      const parts = val.split(' ')[0].split('-');
      if (parts.length === 3) {
        if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
        if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }
      return val;
    }

    function cleanImportPrice(val) {
      if (!val) return '';
      return val.replace(/[^0-9.,]/g, '').replace(',', '.').trim();
    }

    function importFromCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        let newAlbums = [];

        if (text.includes(";") && !text.includes("Title,Artist")) {
          const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length > 1) {
            for (let i = 1; i < lines.length; i++) {
              const cols = lines[i].split(";").map(col => col.replace(/^"|"$/g, '').replace(/""/g, '"'));
              if (cols.length >= 2) {
                newAlbums.push({
                  artist: cols[0] || '',
                  title: cols[1] || '',
                  conductor: cols[2] || '',
                  label: cols[3] || '',
                  year: cols[4] || '',
                  country: cols[5] || '',
                  purchaseDate: cols[6] || '',
                  purchasePrice: cols[7] || '',
                  purchaseLocation: cols[8] || '',
                  support: cols[9] || 'CD',
                  discogsId: cols[10] || '',
                  cover: cols[11] || '',
                  isBoxSet: cols[12] === 'true',
                  volumes: cols[13] ? cols[13].split('||') : []
                });
              }
            }
          }
        } else {
          const rows = parseCSV(text);
          if (rows.length > 1) {
            const headers = rows[0].map(h => h.trim().toLowerCase());
            const findIdx = (exactKeywords, fallbackKeywords = []) => {
              for (const kw of exactKeywords) {
                const idx = headers.findIndex(h => h === kw.toLowerCase());
                if (idx !== -1) return idx;
              }
              for (const kw of fallbackKeywords) {
                const idx = headers.findIndex(h => h.includes(kw.toLowerCase()));
                if (idx !== -1) return idx;
              }
              return -1;
            };

            const titleIdx = findIdx(['title'], ['titre']);
            const artistIdx = findIdx(['artist'], ['artiste']);
            const labelIdx = findIdx(['labels', 'label'], ['éditeur', 'editeur']);
            const mediaIdx = findIdx(['media'], ['format', 'support']);
            const conductorIdx = findIdx(['conductors'], ['conductor', 'chef']);
            const yearIdx = findIdx(['release year'], ['year', 'année']);
            const countryIdx = findIdx(['country'], ['pays']);
            const pdateIdx = findIdx(['purchase date'], ['bought date']);
            const pplaceIdx = findIdx(['purchase place'], ['store', 'lieu']);
            const ppriceIdx = findIdx(['purchase price'], ['price', 'prix']);
            const discogsIdx = findIdx(['discogs release id'], ['discogs']);
            const coverIdx = findIdx(['uploaded image url'], ['cover', 'image']);

            for (let i = 1; i < rows.length; i++) {
              const cols = rows[i];
              if (!cols || cols.length < 2) continue;

              const title = titleIdx !== -1 && cols[titleIdx] ? cols[titleIdx].trim() : '';
              const artist = artistIdx !== -1 && cols[artistIdx] ? cols[artistIdx].trim() : '';
              if (!title && !artist) continue;

              const rawMedia = mediaIdx !== -1 && cols[mediaIdx] ? cols[mediaIdx].trim().toLowerCase() : '';
              let support = 'CD';
              if (rawMedia.includes('vinyl') || rawMedia.includes('vinyle') || rawMedia.includes('lp')) support = 'Vinyle';
              else if (rawMedia.includes('sacd')) support = 'SACD';

              let discogsId = discogsIdx !== -1 && cols[discogsIdx] ? cols[discogsIdx].trim() : '';
              if (discogsId.endsWith('.0')) discogsId = discogsId.slice(0, -2);

              newAlbums.push({
                title: title || 'Sans titre',
                artist: artist || 'Artiste inconnu',
                label: labelIdx !== -1 && cols[labelIdx] ? cols[labelIdx].trim() : '',
                conductor: conductorIdx !== -1 && cols[conductorIdx] ? cols[conductorIdx].trim() : '',
                year: yearIdx !== -1 && cols[yearIdx] ? cols[yearIdx].trim() : '',
                country: countryIdx !== -1 && cols[countryIdx] ? cols[countryIdx].trim() : '',
                purchaseDate: pdateIdx !== -1 ? cleanImportDate(cols[pdateIdx]) : '',
                purchasePrice: ppriceIdx !== -1 ? cleanImportPrice(cols[ppriceIdx]) : '',
                purchaseLocation: pplaceIdx !== -1 && cols[pplaceIdx] ? cols[pplaceIdx].trim() : '',
                discogsId: discogsId,
                support: support,
                cover: coverIdx !== -1 && cols[coverIdx] ? cols[coverIdx].trim() : '',
                isBoxSet: false,
                volumes: []
              });
            }
          }
        }

        if (newAlbums.length > 0) {
          if (confirm(`Voulez-vous importer les ${newAlbums.length} références avec leurs éditeurs ?`)) {
            collection = newAlbums;
            saveCollection();
            alert("Importation réussie avec éditeurs !");
          }
        }
      };
      reader.readAsText(file, "UTF-8");
      event.target.value = '';
    }

    function exportToCSV() {
      let csv = "Artiste;Titre;Chef;Éditeur;Année;Pays;DateAchat;PrixAchat;LieuAchat;Support;DiscogsID;Pochette;IsBoxSet;Volumes\n";
      collection.forEach(a => {
        const vols = a.volumes ? a.volumes.join('||') : '';
        csv += `"${a.artist||''}";"${a.title||''}";"${a.conductor||''}";"${a.label||''}";"${a.year||''}";"${a.country||''}";"${a.purchaseDate||''}";"${a.purchasePrice||''}";"${a.purchaseLocation||''}";"${a.support||''}";"${a.discogsId||''}";"${a.cover||''}";"${a.isBoxSet||false}";"${vols}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "phonotheque_export.csv";
      link.click();
    }

    window.onload = initApp;
  </script>
