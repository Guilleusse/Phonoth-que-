<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
  <title>Phonothèque - Borne Salon</title>
  
  <style>
    body {
      background-color: #121212;
      color: #f3f4f6;
      font-family: Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 10px 45px 60px 15px;
    }

    header {
      background-color: #121212;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 12px 45px 10px 15px;
      border-bottom: 1px solid #2a2a2a;
    }

    #spacer {
      height: 165px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      color: #ffffff;
    }

    .actions-bar {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-dice { background: #7c3aed; }

    .search-box {
      margin-bottom: 8px;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      color: #f3f4f6;
      padding: 10px 36px 10px 12px;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #3a3a3c;
      color: #9ca3af;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .filters-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      flex: 1;
    }

    .chip {
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      color: #9ca3af;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: #f3f4f6;
      color: #121212;
      border-color: #f3f4f6;
    }

    .counter {
      font-size: 12px;
      color: #8e8e93;
      white-space: nowrap;
    }

    .artist-group {
      font-size: 16px;
      font-weight: bold;
      color: #3b82f6;
      margin: 22px 0 10px 2px;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 4px;
    }

    .album-card {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 24px;
      position: relative;
    }

    .cover-box {
      width: 105px;
      height: 105px;
      background: #2c2c2e;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #8e8e93;
      text-align: center;
      cursor: pointer;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-info {
      flex: 1;
      min-width: 0;
      margin-left: 12px;
      cursor: pointer;
    }

    .badge-container {
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      color: white;
      background: #2563eb;
    }
    .badge-Vinyle { background: #d97706; }
    .badge-SACD { background: #0d9488; }
    .badge-Coffret { background: #8b5cf6; }

    .album-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 5px;
      line-height: 1.25;
    }

    .album-sub {
      font-size: 13px;
      color: #9ca3af;
    }

    .btn-card-edit {
      background: #3a3a3c;
      border: 1px solid #555;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .alpha-index {
      position: fixed;
      right: 5px;
      top: 180px;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      background: rgba(28, 28, 30, 0.85);
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      width: 28px;
      padding: 2px 0;
      z-index: 90;
      font-size: 11px;
      font-weight: bold;
      color: #60a5fa;
      cursor: pointer;
    }

    .alpha-index span:hover {
      color: #ffffff;
    }

    .btn-scroll-top {
      position: fixed;
      right: 5px;
      bottom: 10px;
      background: rgba(28, 28, 30, 0.85);
      border: 1px solid #3a3a3c;
      color: #ffffff;
      width: 28px;
      height: 36px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 95;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      overflow-y: auto;
      padding: 15px;
    }

    .modal-content {
      background: #1c1c1e;
      border-radius: 14px;
      max-width: 500px;
      margin: 50px auto;
      padding: 18px;
      border: 1px solid #3a3a3c;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .modal-close {
      background: #3a3a3c;
      color: white;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 13px;
    }
    .details-label { color: #8e8e93; }
    .details-val { font-weight: bold; text-align: right; color: #f3f4f6; }

    .loading {
      text-align: center;
      padding: 40px;
      color: #8e8e93;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <h1>Phonothèque</h1>
      <div class="actions-bar">
        <button class="btn-action btn-dice" onclick="randomAlbum()" title="Album aléatoire">🎲 Dé</button>
        <button class="btn-action" onclick="loadData()" title="Rafraîchir">🔄</button>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Rechercher artiste, album, label..." oninput="onSearchInput()">
      <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearch()" title="Effacer la recherche">✕</button>
    </div>
    <div class="filters-bar">
      <div class="filters">
        <div class="chip active" onclick="setFilter('all', this)">Tous</div>
        <div class="chip" onclick="setFilter('Vinyle', this)">Vinyles</div>
        <div class="chip" onclick="setFilter('CD', this)">CD</div>
        <div class="chip" onclick="setFilter('SACD', this)">SACD</div>
        <div class="chip" onclick="setFilter('Coffret', this)">Coffrets</div>
      </div>
      <div class="counter" id="counter">-- disques</div>
    </div>
  </header>

  <div id="spacer"></div>

  <div id="container">
    <div class="loading">Connexion au serveur...</div>
  </div>

  <div class="alpha-index" id="alphaIndex"></div>
  <button class="btn-scroll-top" onclick="scrollToTop()" title="Retour en haut">&#8593;</button>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle" style="font-weight: bold; font-size: 15px;">Détails</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://mchljfhtgingnqxcjizf.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jaGxqZmh0Z2luZ25xeGNqaXpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTY1NzYsImV4cCI6MjEwNTA3MjU3Nn0.aGv9w7XQB-FOVc7xScX-3HN-5ZcA3d3EM7JOBz0HCuQ';

    var collection = [];
    var currentFilter = 'all';

    function formatProxyCoverUrl(url) {
      if (!url) return '';
      if (url.includes('discogs.com')) {
        return 'https://images.weserv.nl/?url=' + encodeURIComponent(url);
      }
      return url;
    }

    function loadData() {
      var container = document.getElementById('container');
      container.innerHTML = '<div class="loading">Chargement des disques...</div>';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', SUPABASE_URL + '/rest/v1/albums?select=*', true);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);

      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var rows = JSON.parse(xhr.responseText);
            
            if (!rows || rows.length === 0) {
              container.innerHTML = '<div class="loading" style="color:#eab308;">Aucun disque trouvé.</div>';
              return;
            }

            collection = rows.map(function(row) {
              var appData = row.app_data || {};
              var coverUrl = appData.cover || row.cover || '';
              
              if (!coverUrl && row.volumes && row.volumes.length > 0 && row.volumes[0].cover) {
                coverUrl = row.volumes[0].cover;
              }

              var localArtist = localStorage.getItem('local_artist_' + row.id);
              var localSortName = localStorage.getItem('local_sortname_' + row.id);

              var finalArtist = localArtist || row.artist || appData.artist || 'Inconnu';
              var finalSortName = localSortName !== null ? localSortName : (appData.sortName || '');

              return {
                id: row.id,
                artist: finalArtist,
                sortName: finalSortName,
                title: row.title || appData.title || 'Sans titre',
                volumes: row.volumes || [],
                tracks: row.tracks || [],
                support: appData.support || row.support || 'CD',
                label: appData.label || row.label || '',
                year: row.year || appData.year || '',
                country: row.country || appData.country || '',
                style: row.style || appData.style || '',
                conductor: row.conductor || appData.conductor || '',
                notes: row.notes || appData.notes || '',
                cover: coverUrl,
                isBoxSet: appData.isBoxSet || (row.volumes && row.volumes.length > 0) || false,
                isWantlist: appData.isWantlist || false
              };
            });

            sortAndRender();
          } catch (e) {
            container.innerHTML = '<div class="loading" style="color:#ef4444;">Erreur de traitement.</div>';
          }
        } else {
          container.innerHTML = '<div class="loading" style="color:#ef4444;">Erreur serveur (' + xhr.status + ').</div>';
        }
      };

      xhr.onerror = function() {
        container.innerHTML = '<div class="loading" style="color:#ef4444;">Erreur réseau.</div>';
      };

      xhr.send();
    }

    function sortAndRender() {
      collection.sort(function(a, b) {
        var keyA = (a.sortName && a.sortName.trim()) ? a.sortName.trim() : (a.artist || '');
        var keyB = (b.sortName && b.sortName.trim()) ? b.sortName.trim() : (b.artist || '');

        var artistComp = keyA.localeCompare(keyB, 'fr', { sensitivity: 'base' });
        if (artistComp !== 0) return artistComp;
        return (a.title || '').localeCompare(b.title || '', 'fr', { sensitivity: 'base' });
      });
      render();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      var chips = document.getElementsByClassName('chip');
      for (var i = 0; i < chips.length; i++) {
        chips[i].className = 'chip';
      }
      el.className = 'chip active';
      render();
    }

    function onSearchInput() {
      var val = document.getElementById('searchInput').value;
      var clearBtn = document.getElementById('searchClearBtn');
      
      if (val.length > 0) {
        clearBtn.style.display = 'flex';
      } else {
        clearBtn.style.display = 'none';
      }
      
      render();
    }

    function clearSearch() {
      var searchInput = document.getElementById('searchInput');
      searchInput.value = '';
      document.getElementById('searchClearBtn').style.display = 'none';
      render();
    }

    function getFilteredList() {
      var searchInput = document.getElementById('searchInput');
      var search = searchInput ? searchInput.value.toLowerCase().trim() : '';

      return collection.filter(function(album) {
        if (album.isWantlist) return false;
        if (currentFilter === 'Coffret' && !album.isBoxSet) return false;
        if (currentFilter !== 'all' && currentFilter !== 'Coffret' && album.support !== currentFilter) return false;

        if (search) {
          var t = (album.title || '').toLowerCase();
          var a = (album.artist || '').toLowerCase();
          var l = (album.label || '').toLowerCase();
          return t.indexOf(search) !== -1 || a.indexOf(search) !== -1 || l.indexOf(search) !== -1;
        }
        return true;
      });
    }

    function scrollToLetter(letter) {
      var groups = document.getElementsByClassName('artist-group');
      for (var i = 0; i < groups.length; i++) {
        var groupKey = groups[i].getAttribute('data-sortkey') || '';
        if (groupKey.toUpperCase().indexOf(letter) === 0) {
          var headerHeight = 175; 
          var elementPosition = groups[i].getBoundingClientRect().top;
          var offsetPosition = elementPosition + window.pageYOffset - headerHeight;
          
          window.scrollTo(0, offsetPosition);
          break;
        }
      }
    }

    function scrollToTop() {
      window.scrollTo(0, 0);
    }

    function renderAlphaIndex() {
      var indexContainer = document.getElementById('alphaIndex');
      indexContainer.innerHTML = '';
      var alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
      
      alphabet.forEach(function(letter) {
        var span = document.createElement('span');
        span.textContent = letter;
        span.onclick = function() { scrollToLetter(letter); };
        indexContainer.appendChild(span);
      });
    }

    function render() {
      var container = document.getElementById('container');
      container.innerHTML = '';

      var filtered = getFilteredList();

      document.getElementById('counter').textContent = filtered.length + ' disque' + (filtered.length > 1 ? 's' : '');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loading">Aucun disque trouvé.</div>';
        return;
      }

      renderAlphaIndex();

      var currentGroupKey = '';
      filtered.forEach(function(album) {
        var sortKey = (album.sortName && album.sortName.trim()) ? album.sortName.trim() : (album.artist || '');

        if (sortKey !== currentGroupKey) {
          currentGroupKey = sortKey;
          var groupHeader = document.createElement('div');
          groupHeader.className = 'artist-group';
          groupHeader.setAttribute('data-sortkey', currentGroupKey);
          // Affiche le nom complet de l'artiste (ex: Alain Bashung) sous l'index de tri
          groupHeader.textContent = album.artist;
          container.appendChild(groupHeader);
        }

        var card = document.createElement('div');
        card.className = 'album-card';

        var badgeText = album.support;
        if (album.isBoxSet) badgeText = 'Coffret ' + album.support;

        var proxyCover = formatProxyCoverUrl(album.cover);
        var coverHtml = proxyCover 
          ? '<img src="' + proxyCover + '" crossorigin="anonymous" onerror="this.style.display=\'none\'">' 
          : 'Pochette';

        var leftPart = document.createElement('div');
        leftPart.style.display = 'flex';
        leftPart.style.alignItems = 'center';
        leftPart.style.gap = '15px';
        leftPart.style.flex = '1';
        leftPart.style.cursor = 'pointer';
        leftPart.onclick = function() { showDetails(album); };

        leftPart.innerHTML = 
          '<div class="cover-box">' + coverHtml + '</div>' +
          '<div class="album-info">' +
            '<div class="badge-container"><span class="badge badge-' + album.support + '">' + badgeText + '</span></div>' +
            '<div class="album-title">' + (album.title || '') + '</div>' +
            '<div class="album-sub">' + (album.label || '') + (album.year ? ' • ' + album.year : '') + '</div>' +
          '</div>';

        var editBtn = document.createElement('button');
        editBtn.className = 'btn-card-edit';
        editBtn.innerHTML = '✏️';
        editBtn.title = "Modifier l'artiste en local";
        editBtn.onclick = function(e) {
          e.preventDefault();
          editArtist(album);
        };

        card.appendChild(leftPart);
        card.appendChild(editBtn);
        container.appendChild(card);
      });
    }

    function editArtist(album) {
      var newArtist = prompt("Modifier l'artiste affiché (ex: Alain Bashung) :", album.artist);
      if (newArtist !== null && newArtist.trim() !== "") {
        var newSortName = prompt("Modifier le nom de tri (ex: Bashung, Alain) :", album.sortName || album.artist);
        
        album.artist = newArtist.trim();
        album.sortName = newSortName !== null ? newSortName.trim() : '';

        localStorage.setItem('local_artist_' + album.id, album.artist);
        localStorage.setItem('local_sortname_' + album.id, album.sortName);
        
        sortAndRender();
      }
    }

    function randomAlbum() {
      var filtered = getFilteredList();
      if (filtered.length === 0) return;
      var randomIndex = Math.floor(Math.random() * filtered.length);
      showDetails(filtered[randomIndex]);
    }

    function showDetails(album) {
      var modal = document.getElementById('modal');
      var body = document.getElementById('modalBody');
      var title = document.getElementById('modalTitle');

      title.textContent = album.title || 'Détails';

      var proxyModalCover = formatProxyCoverUrl(album.cover);
      var coverImgHtml = proxyModalCover ? '<img src="' + proxyModalCover + '" crossorigin="anonymous" style="width:100%; max-height:220px; object-fit:contain; border-radius:10px; margin-bottom:12px; background:#121212;">' : '';

      var html = coverImgHtml +
        '<div class="details-row"><span class="details-label">Artiste :</span><span class="details-val">' + (album.artist || '-') + '</span></div>' +
        '<div class="details-row"><span class="details-label">Support :</span><span class="details-val">' + (album.support || '-') + '</span></div>' +
        '<div class="details-row"><span class="details-label">Label :</span><span class="details-val">' + (album.label || '-') + '</span></div>' +
        '<div class="details-row"><span class="details-label">Année :</span><span class="details-val">' + (album.year || '-') + '</span></div>' +
        '<div class="details-row"><span class="details-label">Pays :</span><span class="details-val">' + (album.country || '-') + '</span></div>' +
        '<div class="details-row"><span class="details-label">Genre :</span><span class="details-val">' + (album.style || '-') + '</span></div>';

      if (album.conductor) {
        html += '<div class="details-row"><span class="details-label">Chef d\'orchestre :</span><span class="details-val">' + album.conductor + '</span></div>';
      }
      if (album.notes) {
        html += '<div class="details-row"><span class="details-label">Notes :</span><span class="details-val">' + album.notes + '</span></div>';
      }

      if (album.isBoxSet && album.volumes && album.volumes.length > 0) {
        html += '<div style="margin-top:14px; font-weight:bold; font-size:13px; color:#3b82f6;">Disques du coffret (' + album.volumes.length + ') :</div>';
        for (var i = 0; i < album.volumes.length; i++) {
          var v = album.volumes[i];
          html += '<div style="background:#121212; padding:8px 10px; border-radius:6px; margin-top:6px; font-size:12px;"><b>Disque ' + (i+1) + ':</b> ' + (v.title || '') + '</div>';
        }
      } else if (album.tracks && album.tracks.length > 0) {
        html += '<div style="margin-top:14px; font-weight:bold; font-size:13px; color:#3b82f6;">Pistes :</div>';
        for (var j = 0; j < album.tracks.length; j++) {
          var t = album.tracks[j];
          html += '<div style="font-size:12px; padding:4px 0; border-bottom:1px solid #2a2a2a; color:#8e8e93;"><b>' + (t.position || (j+1)) + '.</b> ' + (t.title || '') + '</div>';
        }
      }

      body.innerHTML = html;
      modal.style.display = 'block';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    window.onload = function() {
      loadData();
    };
  </script>
</body>
</html>
